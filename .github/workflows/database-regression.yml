name: Database regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - name: Test preview configuration guards
        run: node --test scripts/platform/environment.test.mjs scripts/roles/prepare-import.test.mjs
      - name: Replay migrations and test direct database permissions
        run: bash scripts/platform/test-database.sh
      - name: Test additive role import against PostgreSQL
        run: node --test scripts/roles/import.integration.test.mjs
      - name: Install encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Rehearse encrypted backup recovery with synthetic data
        # Use matching pg_dump/pg_restore rather than the runner's default client.
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -v /usr/bin/age:/usr/local/bin/age:ro \
            -v /usr/bin/age-keygen:/usr/local/bin/age-keygen:ro \
            -e TEST_DATABASE_URL \
            postgres:17-bookworm bash scripts/platform/test-backup.sh
