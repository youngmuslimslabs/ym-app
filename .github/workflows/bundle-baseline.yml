name: Update bundle size baseline

# Regenerates bundle-size-baseline.json on push to main using the same Bun
# version + OS as the CI bundle check, and commits any drift back. This decouples
# the baseline from whichever machine first generated it (the original "works on
# my macOS" trap) and makes the PR-side `--check-only` gate honest: every PR
# compares against a baseline produced in the same environment as its build.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'next.config.ts'
      - 'src/**'
      - 'scripts/check-bundle-size.ts'
  workflow_dispatch:

env:
  BUN_VERSION: "1.2.21"

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN — sufficient for pushing back to main.
          # Note: pushes here do NOT trigger another workflow run (GH Actions
          # default behavior with GITHUB_TOKEN), which avoids an infinite loop.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Regenerate baseline
        run: bun run scripts/check-bundle-size.ts --update

      - name: Commit baseline drift, if any
        run: |
          if git diff --quiet bundle-size-baseline.json; then
            echo "Baseline unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle-size-baseline.json
          git commit -m "chore: refresh bundle-size baseline

          Auto-generated by .github/workflows/bundle-baseline.yml after a change to
          source, deps, or the bundle check script."
          git push
