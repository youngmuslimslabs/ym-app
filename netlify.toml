[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Keep in lockstep with .github/workflows/ci.yml BUN_VERSION
  BUN_VERSION = "1.2.21"

# Deploy Preview settings (for PRs)
[context.deploy-preview]
  command = "bun run build"

# Production settings — inject + upload source maps to PostHog after build
# Requires POSTHOG_CLI_PERSONAL_API_KEY in Netlify environment variables
[context.production]
  command = "bun run build && bunx posthog-cli sourcemaps inject --directory .next && bunx posthog-cli sourcemaps upload --directory .next"

# Local development with Netlify Dev CLI
[dev]
  command = "bun run dev"
  port = 3000
