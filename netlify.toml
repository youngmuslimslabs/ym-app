[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Keep in lockstep with .github/workflows/ci.yml BUN_VERSION
  BUN_VERSION = "1.2.21"
  # Exclude the Supabase source tree from Netlify secret scanning. These are DB
  # SQL fixtures (migrations + seeds), not deployed artifacts — the publish dir
  # is `.next`, so nothing here ships to the runtime. The seeds legitimately
  # contain roster @youngmuslims.com emails, one of which equals the value of
  # the GOOGLE_ADMIN_EMAIL env var (the admin is also a roster member), which
  # the scanner flags as a "leaked secret" false positive. Scoped to supabase/**
  # so real app code and the build output are still scanned.
  SECRETS_SCAN_OMIT_PATHS = "supabase/**"

# Deploy Preview settings (for PRs)
[context.deploy-preview]
  command = "bun run build"

# Production settings — inject + upload source maps to PostHog after build
# Requires POSTHOG_CLI_PERSONAL_API_KEY in Netlify environment variables
[context.production]
  command = "bun run build && (bunx posthog-cli sourcemaps inject --directory .next && bunx posthog-cli sourcemaps upload --directory .next || true) && find .next -name '*.map' -delete"

# Local development with Netlify Dev CLI
[dev]
  command = "bun run dev"
  port = 3000

# Security headers applied to every response served through Netlify.
# Wildcards on supabase.co / posthog.com / googleusercontent.com are used
# rather than exact hosts so deploy previews and future project rotations
# don't require a config change. Tightening to exact hosts is a follow-up
# once the prod project URL stabilises. The CSP is a single-line string —
# TOML multiline basic strings preserve leading whitespace on the first
# content line, which would inject spaces into the header value.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # camera/microphone/geolocation are allow-listed to https://form.jotform.com
    # so the finance embed can use those APIs if a form ever needs them.
    Permissions-Policy = "camera=(self \"https://form.jotform.com\"), microphone=(self \"https://form.jotform.com\"), geolocation=(self \"https://form.jotform.com\"), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://*.posthog.com https://cdn.jotfor.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://accounts.google.com https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.posthog.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://form.jotform.com https://submit.jotform.com https://www.jotform.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
